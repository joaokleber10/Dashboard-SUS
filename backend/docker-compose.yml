# Uso:  cp .env.example .env   &&   docker compose up --build
# Todas as variáveis vêm do arquivo .env (env_file + interpolação ${...}).

services:
  # 1) Coleta/limpeza do SIH e carga no DuckDB. Idempotente: meses já processados são pulados.
  etl:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: sus-backend
    env_file: .env
    command: python -m src.etl
    volumes:
      - dados:/app/data
    restart: "no"

  # 2) API FastAPI (lê o DuckDB em modo somente leitura). Só sobe depois que o ETL termina com sucesso.
  backend:
    image: sus-backend
    env_file: .env
    depends_on:
      etl:
        condition: service_completed_successfully
    volumes:
      - dados:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen('http://localhost:%s/health' % os.getenv('BACKEND_PORT','8000'))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # 3) Frontend React servido pelo Nginx.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  # Volume nomeado (e não pasta do projeto): evita problemas de permissão e de bloqueio de
  # arquivo do DuckDB em pastas sincronizadas (OneDrive) ou montadas do Windows.
  dados:
